name: Publish Web Port

on:
  push:
    branches:
      - main
    paths:
      - web/**
      - Assets/**
      - '*.plist'
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install audio converter
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Run tests
        run: npm test
      - name: Build Web Port
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Verify generated audio is in the Pages artifact
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const manifest = JSON.parse(readFileSync('dist/content/manifest.json', 'utf8'));
          const audio = Object.values(manifest.audio);
          assert.ok(audio.length > 0, 'The Pages build must include audio');
          for (const asset of audio) {
            const bytes = readFileSync(`dist/content/${asset.url}`);
            assert.equal(bytes.length, asset.bytes, asset.url);
            assert.equal(createHash('sha256').update(bytes).digest('hex'), asset.sha256, asset.url);
          }
          console.log(`Verified ${audio.length} generated audio files in the Pages artifact.`);
          JS
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
